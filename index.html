<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Katrina Kirton Sherrod — REALTOR® serving Maryland, Washington D.C., and Pennsylvania. Trusted advisor for first-time buyers, families, and investors." />
    <meta name="theme-color" content="#000000" />
    <meta property="og:title" content="Katrina Kirton Sherrod — REALTOR® | MD · DC · PA" />
    <meta property="og:description" content="Beyond houses, we find you a place to call home." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital,wght@0,400;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Katrina Kirton Sherrod — REALTOR® | Maryland · DC · Pennsylvania</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Hidden form so Netlify's build-time bot can detect this form.
      The visible form lives in OpenHouseForm.tsx and POSTs to / with the
      same `name` so Netlify routes submissions correctly.
    -->
    <form name="open-house-signin" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="property" />
      <input type="text" name="working_with_agent" />
      <textarea name="notes"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
